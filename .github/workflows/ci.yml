name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt bandit pip-audit
      - run: python -m pytest -q
      - run: python -m bandit -r app scripts config.py run.py -q
      - run: python -m pip_audit -r requirements.txt
      - run: python scripts/verify_release.py
